[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @unseen-gadget/database build && pnpm --filter @unseen-gadget/validations build && pnpm --filter @unseen-gadget/backend build"

[deploy]
startCommand = "node apps/backend/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
